<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="no_save_password_control.min.js"></script>
</head>
<body>
    <h1>Password Save Control Test</h1>
    <form>
        <label for="username">Username:</label>
        <input type="text" id="username" name="username"><br><br>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password"><br><br>
        <input type="submit" value="Submit">
    </form>
    <script>
        // DOMContentLoaded bekle
        window.addEventListener('DOMContentLoaded', () => {
            const oldPasswordInput = document.getElementById('password');
            
            NoSavePasswordInput.replaceInput(oldPasswordInput, {
                revealToggle: true,
                maskChar: '●',
                disablePaste: true
            });
        });
    </script>
</body>
</html>
